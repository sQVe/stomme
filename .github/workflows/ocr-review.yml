name: OCR review

on:
  workflow_call:
    secrets:
      model-token:
        required: true

jobs:
  review:
    name: OCR review
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: ocr-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      OCR_APP_SLUG: github-actions
      OCR_CHECKPOINT_RANGE: 'true'
      OCR_INCREMENTAL: 'true'
      OCR_STICKY_SUMMARY: 'true'
      OCR_VERSION: '1.14.2'
      OCR_LLM_URL: https://api.morphllm.com/v1
      OCR_LLM_MODEL: morph-dsv41flash-1017
      OCR_RULE: docs/stomme/ocr-rules.json
      OCR_EXTRA_BODY: '{"thinking": {"type": "disabled"}}'
      RESOLVE_OUTDATED: 'true'
    steps:
      - name: Check the model token
        env:
          MODEL_TOKEN: ${{ secrets.model-token }}
        run: |
          if [ -z "$MODEL_TOKEN" ]; then
            echo "::error::MORPH_API_KEY is not set"
            exit 1
          fi

      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The full history, so the merge base of a rebased pull request is
          # computable and the scope command never meets a shallow clone.
          fetch-depth: 0

      - name: Check out the OCR posting helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: alibaba/open-code-review
          ref: e74f2c6bd4422bd1e12d257d1725bcce1d6b9ddd
          path: .ocr-action
          persist-credentials: false

      - name: Resolve the review refs
        env:
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          BASE_REF="$EVENT_BASE_REF"
          HEAD_SHA="$EVENT_HEAD_SHA"
          PR_NUMBER="$EVENT_PR_NUMBER"
          if [ -z "$PR_NUMBER" ] || [ -z "$BASE_REF" ]; then
            echo "::error::the event payload names no pull request to review"
            exit 1
          fi
          if ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::the pull request head is not a full commit SHA: \"$HEAD_SHA\""
            exit 1
          fi
          git fetch origin "pull/${PR_NUMBER}/head"
          git fetch origin "$BASE_REF"
          MERGE_BASE="$(git merge-base "origin/${BASE_REF}" "$HEAD_SHA")"
          {
            echo "BASE_REF=$BASE_REF"
            echo "HEAD_SHA=$HEAD_SHA"
            echo "PR_NUMBER=$PR_NUMBER"
            echo "MERGE_BASE=$MERGE_BASE"
          } >> "$GITHUB_ENV"
          echo "Reviewing ${HEAD_SHA} from merge-base ${MERGE_BASE} (base origin/${BASE_REF})"

      - name: Resolve the review range
        id: range
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const crypto = require('crypto');

            // Every branch here only chooses where the review starts, and each
            // one has the same safe answer: review the whole pull request. So
            // nothing in this step may fail the job.
            const decide = (mode, reason, fields = {}) => {
              core.setOutput('mode', mode);
              core.setOutput('reason', reason);
              core.setOutput('reviewed', fields.reviewed || '');
              core.setOutput('reviewed_base', fields.reviewed_base || '');
              core.setOutput('carry', fields.carry || '');
              core.info(`[range] ${mode}: ${reason}`);
            };

            const workspace = process.env.GITHUB_WORKSPACE || '.';
            const rulePath = path.resolve(workspace, process.env.OCR_RULE || '');
            let ruleDigest = 'none';
            try {
              ruleDigest = crypto.createHash('sha256').update(fs.readFileSync(rulePath)).digest('hex');
            } catch (error) {
              core.warning(`[range] cannot read ${rulePath} (${error.message}); reviewing the whole pull request.`);
              core.setOutput('fingerprint', '');
              decide('full', 'rule_unreadable');
              return;
            }

            // Everything that changes what a review would say. JSON keeps the
            // fields length-delimited, so no value can shift a field boundary
            // and make two different configurations hash alike.
            const fingerprint = crypto.createHash('sha256')
              .update(JSON.stringify([
                process.env.OCR_VERSION || '',
                process.env.OCR_LLM_MODEL || '',
                process.env.OCR_LLM_URL || '',
                ruleDigest,
              ]))
              .digest('hex')
              .slice(0, 16);
            core.setOutput('fingerprint', fingerprint);

            const helper = path.join(
              workspace,
              '.ocr-action',
              'scripts',
              'github-actions',
              'post-review-comments.js',
            );

            try {
              const { readCheckpointComment, validateCheckpointPayload } = require(helper);
              const prNumber = Number(process.env.PR_NUMBER);
              const existing = await readCheckpointComment({
                github,
                owner: context.repo.owner,
                repo: context.repo.repo,
                prNumber,
                appSlug: process.env.OCR_APP_SLUG || '',
                log: (line) => core.info(line),
              });
              if (existing.reason !== 'ok') {
                decide('full', existing.reason);
                return;
              }
              const invalid = validateCheckpointPayload(existing.payload, { prNumber });
              if (invalid) {
                core.info(`[range] marker rejected (${invalid}); reviewing the whole pull request.`);
                decide('full', 'schema_invalid');
                return;
              }
              // The configuration is compared before anything about the base:
              // findings from another model, rule file, or OCR version are not
              // comparable to this run's, wherever the base moved.
              if (existing.payload.fingerprint !== fingerprint) {
                decide('full', 'config_changed');
                return;
              }
              // The same head is only a no-op when it was reviewed against the
              // same base. A retargeted pull request exposes lines that the
              // earlier review never saw, so it builds a scope instead.
              const sameHead = existing.payload.head === process.env.HEAD_SHA;
              const sameBase = existing.payload.merge_base === process.env.MERGE_BASE;
              if (sameHead && sameBase) {
                decide('noop', 'same_head_noop', { carry: existing.raw });
                return;
              }
              decide('scoped', 'ok', {
                reviewed: existing.payload.head,
                reviewed_base: existing.payload.merge_base,
                carry: existing.raw,
              });
            } catch (error) {
              core.warning(`[range] cannot read the checkpoint (${error.message}); reviewing the whole pull request.`);
              decide('full', 'resolver_error');
            }

      - name: Install stomme from the project pin
        if: steps.range.outputs.mode != 'noop'
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9

      - name: Build the review scope
        id: scope
        if: steps.range.outputs.mode == 'scoped'
        env:
          REVIEWED: ${{ steps.range.outputs.reviewed }}
          REVIEWED_BASE: ${{ steps.range.outputs.reviewed_base }}
        run: |
          # Every failure here falls back to the whole pull request, because a
          # narrowed range this step cannot prove is worse than a wide one.
          fallback() {
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "::warning::$1 Reviewing the whole pull request."
          }

          if ! git fetch --filter=blob:none origin "$REVIEWED" > /dev/null 2>&1; then
            fallback "Cannot fetch the head of the last complete review (${REVIEWED})."
            exit 0
          fi

          scope_exit=0
          base="$(stomme ocr-scope --reviewed "$REVIEWED" --reviewed-base "$REVIEWED_BASE" --base "$MERGE_BASE" --head "$HEAD_SHA" 2> /tmp/ocr-scope.err)" || scope_exit=$?
          if [ "$scope_exit" != "0" ]; then
            detail="$(tail -n 1 /tmp/ocr-scope.err 2> /dev/null || true)"
            fallback "The scope command failed: ${detail:-no error output}"
            exit 0
          fi
          if [ -z "$base" ]; then
            fallback "The scope command printed no base commit."
            exit 0
          fi

          counts="$(sed -n 's/^stomme: scope: //p' /tmp/ocr-scope.err 2> /dev/null | tail -n 1)"
          if [ "$base" = "empty" ]; then
            # The scope holds no new lines, so there is nothing to review. The
            # record states that this head is covered, so the next push narrows
            # from it and this run advances the marker.
            cat > /tmp/ocr-result.json <<JSON
          {"status":"complete","manifest":{"schema_version":"ocr.run-manifest/v1","terminal_state":"complete","input":{"resolved_head":"${HEAD_SHA}"},"coverage":{"selected":[],"completed":[],"reused":[],"failed":[],"waived":[],"excluded":[]}}}
          JSON
            echo "OCR_EXIT_CODE=0" >> "$GITHUB_ENV"
            {
              echo "mode=empty"
              echo "note=Scope since the last complete review: no new lines"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$counts" ]; then
            note="Scope since the last complete review: $counts"
          else
            note="Scope since the last complete review (counts unavailable)"
          fi
          {
            echo "mode=scoped"
            echo "base=$base"
            echo "note=$note"
          } >> "$GITHUB_OUTPUT"

      - name: Install the pinned OpenCodeReview
        if: steps.range.outputs.mode != 'noop'
        env:
          # Keep the review on the install performed here: the launcher's
          # detached self-updater would replace the runtime mid-run.
          OCR_NO_UPDATE: '1'
        run: |
          npm install -g "@alibaba-group/open-code-review@${OCR_VERSION}"
          ocr version

      - name: Configure OCR
        if: steps.range.outputs.mode != 'noop'
        env:
          OCR_NO_UPDATE: '1'
        run: |
          ocr config unset provider
          ocr config set llm.auth_token ""
          ocr config set llm.extra_headers ""
          ocr config set llm.retry_codes ""
          ocr config set llm.url "$OCR_LLM_URL"
          ocr config set llm.model "$OCR_LLM_MODEL"
          ocr config set llm.use_anthropic "false"
          ocr config set llm.protocol "openai"
          ocr config set llm.auth_header ""
          # The command OCR runs at request time, so the token never reaches the
          # config file. The escaped dollar keeps it unexpanded here.
          ocr config set llm.auth_token_cmd "printf \"%s\" \"\$OCR_LLM_TOKEN\""
          ocr config set llm.extra_body "$OCR_EXTRA_BODY"
          ocr config set language "English"

      - name: Run the review
        id: review
        if: steps.range.outputs.mode != 'noop' && steps.scope.outputs.mode != 'empty'
        env:
          MODEL_TOKEN: ${{ secrets.model-token }}
          RANGE_FROM: ${{ steps.scope.outputs.base }}
          SCOPE_NOTE: ${{ steps.scope.outputs.note }}
        run: |
          # A partial review from a timeout or a provider error exits nonzero,
          # and the classification below decides the job result.
          args=(
            --from "${RANGE_FROM:-$MERGE_BASE}"
            --to "$HEAD_SHA"
            --rule "$OCR_RULE"
            --format json
            --audience agent
            --timeout 15
          )
          echo "Reviewing ${args[1]}..${HEAD_SHA}"
          echo "${SCOPE_NOTE:-The run reviews the whole pull request.}"
          code=0
          OCR_LLM_TOKEN="$MODEL_TOKEN" OCR_LLM_TIMEOUT="300" OCR_NO_UPDATE="1" \
            ocr review "${args[@]}" > /tmp/ocr-result.json 2> /tmp/ocr-stderr.log || code=$?
          echo "OCR_EXIT_CODE=$code" >> "$GITHUB_ENV"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "=== OCR result ==="
          cat /tmp/ocr-result.json
          echo "=== OCR stderr ==="
          cat /tmp/ocr-stderr.log

      - name: Upload the review result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ocr-review-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/ocr-result.json
            /tmp/ocr-stderr.log
          if-no-files-found: warn

      - name: Classify and resume the review
        id: outcome
        if: steps.range.outputs.mode != 'noop'
        env:
          STOMME: stomme
          MODEL_TOKEN: ${{ secrets.model-token }}
          RANGE_FROM: ${{ steps.scope.outputs.base }}
          OCR_EXIT_CODE: ${{ env.OCR_EXIT_CODE }}
        run: |
          token="$MODEL_TOKEN"
          trap 'echo "final=1" >> "$GITHUB_OUTPUT"' ERR

          # The first review and its retries. A provider error says nothing
          # about the change, so the review is retried before the check fails.
          MAX_ATTEMPTS=3

          failure_reason() {
            local result="$1" errors="${2:-}" reason="" parsed=0 hint=""
            if [ -f "$result" ] && jq -e 'true' "$result" > /dev/null 2>&1; then
              parsed=1
              reason="$(jq -r '
                if .manifest.run_failure != null then
                  (if ((.manifest.run_failure.reason // "") | length) > 0
                   then .manifest.run_failure.reason
                   else .manifest.run_failure.classification end)
                else
                  ([.manifest.coverage.failed[]? | .classification // empty] | unique
                    | if length > 0 then join(", ") else empty end)
                end
              ' "$result" 2>/dev/null || true)"
            fi
            if [ -n "$reason" ]; then
              echo "$reason"
              return
            fi
            if [ -n "$errors" ] && [ -s "$errors" ]; then
              hint="$(grep -v '^[[:space:]]*$' "$errors" | tail -n 1)"
            fi
            if [ -n "$hint" ]; then
              echo "the OCR run wrote no usable result: $hint"
              return
            fi
            if [ "$parsed" = "1" ]; then
              echo "the OCR run recorded no failure reason"
              return
            fi
            echo "the OCR run wrote no result"
          }

          verdict() {
            case "$1" in
              0) echo complete ;;
              2) echo partial ;;
              *) echo failed ;;
            esac
          }

          # The files a result leaves unreviewed. The retry decision and the
          # message it reports must agree on them.
          UNREVIEWED='def unreviewed_ids:
            [.coverage.selected[]? | .item_id]
            - ([.coverage.completed[]? | .item_id] + [.coverage.reused[]? | .item_id]);'

          # A provider error is a service failure, not a finding about the
          # change. It is retried only when every unreviewed file failed that
          # way, so a run failure or another classification is reported at once.
          provider_failure() {
            [ -f "$1" ] || return 1
            jq -e "$UNREVIEWED"'
              def provider_ids:
                [.coverage.failed[]? | select(.classification == "provider") | .item_id];
              .manifest as $manifest
              | ($manifest.run_failure == null)
                and (($manifest | unreviewed_ids) as $unreviewed
                  | ($unreviewed | length) > 0
                    and (($unreviewed - ($manifest | provider_ids)) | length) == 0)
            ' "$1" > /dev/null 2>&1
          }

          # A reader must be able to tell an outage from a problem with the
          # change.
          provider_reason() {
            local result="$1" attempts="$2" reason
            reason="$(jq -r --argjson attempts "$attempts" "$UNREVIEWED"'
              .manifest as $manifest
              | ($manifest | unreviewed_ids) as $unreviewed
              | [$manifest.coverage.selected[]?
                  | select(.item_id as $id | $unreviewed | index($id))
                  | (.path | gsub("[[:cntrl:]]"; " "))] as $paths
              | ($paths | length) as $count
              | if $count == 0 then empty
                else
                  "the review provider could not review "
                  + (if $count == 1 then "1 file" else "\($count) files" end)
                  + " after \($attempts) "
                  + (if $attempts == 1 then "attempt" else "attempts" end)
                  + ": "
                  + (if $count > 5
                     then ($paths[:5] | join(", ")) + ", and \($count - 5) more"
                     else $paths | join(", ") end)
                end
            ' "$result" 2>/dev/null || true)"
            if [ -z "$reason" ]; then
              echo "the review provider failed and left files unreviewed"
              return
            fi
            echo "$reason"
          }

          result=/tmp/ocr-result.json
          reason_file=/tmp/ocr-result.json
          reason_errors=""
          attempts=1
          budget_resumes=0
          classified=0
          final=0
          posted=0
          ocr_exit="${OCR_EXIT_CODE:-}"

          if [ -f "$result" ]; then
            "$STOMME" ocr-coverage "$result" \
              > /tmp/ocr-coverage.md 2> /tmp/ocr-coverage.err || final=$?
            if [ -s /tmp/ocr-coverage.md ]; then
              classified=1
            else
              reason_errors=/tmp/ocr-coverage.err
            fi
          else
            final=1
          fi
          cp /tmp/ocr-coverage.md /tmp/ocr-first-coverage.md 2>/dev/null || true
          {
            echo "final=$final"
            echo "first_final=$final"
            echo "coverage_source=first"
          } >> "$GITHUB_OUTPUT"
          # The verdict names the classification of the coverage file that the
          # insert step puts into the summary comment, not the job result.
          echo "coverage_verdict=$(verdict "$final")" >> "$GITHUB_OUTPUT"

          session_id="$(jq -r '.session_id // empty' "$result" 2>/dev/null || true)"

          if [ "$final" = "2" ] && [ "$ocr_exit" = "0" ] && [ -z "$session_id" ]; then
            echo "::warning::The partial review recorded no session to resume."
            echo "final=1" >> "$GITHUB_OUTPUT"
            {
              echo 'reason<<OCR_REASON'
              echo 'the partial review recorded no session to resume'
              echo 'OCR_REASON'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A budget partial is resumed once, because its budget is spent. A
          # provider failure is retried. A result that the coverage command
          # rejects is never resumed.
          resumable() {
            if [ -z "$session_id" ]; then
              return 1
            fi
            if [ "$classified" != "1" ]; then
              return 1
            fi
            if [ "$attempts" -ge "$MAX_ATTEMPTS" ]; then
              return 1
            fi
            if provider_failure "$result"; then
              return 0
            fi
            if [ "$final" != "2" ] || [ "$ocr_exit" != "0" ] || [ "$budget_resumes" != "0" ]; then
              return 1
            fi
            return 0
          }

          while resumable; do
            attempts=$((attempts + 1))
            if ! provider_failure "$result"; then
              budget_resumes=$((budget_resumes + 1))
            fi
            args=(
              --from "${RANGE_FROM:-$MERGE_BASE}"
              --to "$HEAD_SHA"
              --resume "$session_id"
              --rule "$OCR_RULE"
              --format json
              --audience agent
            )
            if [ -n "${EFFORT:-}" ]; then
              args+=(--effort "$EFFORT")
            fi

            ocr_exit=0
            rm -f /tmp/ocr-resume.json /tmp/ocr-resume.err
            OCR_LLM_TOKEN="$token" OCR_LLM_TIMEOUT="300" OCR_NO_UPDATE="1" \
              ocr review "${args[@]}" > /tmp/ocr-resume.json 2> /tmp/ocr-resume.err || ocr_exit=$?
            reason_file=/tmp/ocr-resume.json

            # The resumed JSON is classified whenever it holds usable JSON,
            # whatever the resume exit code. An unusable or missing result keeps
            # the coverage of the previous attempt.
            resumed=0
            rm -f /tmp/ocr-resume-coverage.md /tmp/ocr-resume-coverage.err
            if [ -f /tmp/ocr-resume.json ]; then
              "$STOMME" ocr-coverage /tmp/ocr-resume.json \
                > /tmp/ocr-resume-coverage.md 2> /tmp/ocr-resume-coverage.err || resumed=$?
            else
              resumed=1
            fi
            if [ ! -s /tmp/ocr-resume-coverage.md ]; then
              posted=0
              final=1
              reason_errors=/tmp/ocr-resume-coverage.err
              if [ -s /tmp/ocr-resume.err ]; then
                reason_errors=/tmp/ocr-resume.err
              fi
              break
            fi

            result=/tmp/ocr-resume.json
            final="$resumed"
            classified=1
            posted=1
            mv /tmp/ocr-resume-coverage.md /tmp/ocr-coverage.md
            mv /tmp/ocr-resume-coverage.err /tmp/ocr-coverage.err 2>/dev/null || true
            {
              echo "coverage_source=resumed"
              echo "resumed=true"
            } >> "$GITHUB_OUTPUT"
            echo "coverage_verdict=$(verdict "$resumed")" >> "$GITHUB_OUTPUT"
            session_id="$(jq -r '.session_id // empty' "$result" 2>/dev/null || true)"
          done

          # Only a result this run can post reaches the posting helper.
          if [ "$posted" = "1" ]; then
            if [ "$final" = "0" ] || [ "$final" = "2" ]; then
              echo "post_resumed=true" >> "$GITHUB_OUTPUT"
            fi
          fi

          if [ "$final" = "0" ] && [ "$ocr_exit" = "0" ]; then
            echo "final=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$final" = "2" ] && [ "$ocr_exit" = "0" ]; then
            echo "final=2" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$classified" = "1" ] && provider_failure "$result"; then
            reason="$(provider_reason "$result" "$attempts")"
          else
            reason="$(failure_reason "$reason_file" "$reason_errors")"
          fi
          echo "final=1" >> "$GITHUB_OUTPUT"
          {
            echo 'reason<<OCR_REASON'
            echo "$reason"
            echo 'OCR_REASON'
          } >> "$GITHUB_OUTPUT"

      - name: Post the review
        id: post
        if: steps.review.outputs.exit_code == '0' || steps.scope.outputs.mode == 'empty'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RESULT_PATH: /tmp/ocr-result.json
          STDERR_PATH: /tmp/ocr-stderr.log
          # The marker advances only past a run whose coverage command reported
          # every selected file as reviewed. A waived or oversize-excluded file
          # leaves the previous marker, so the next range only widens.
          CHECKPOINT_FINGERPRINT: ${{ steps.outcome.outputs.first_final == '0' && steps.range.outputs.fingerprint || '' }}
          CHECKPOINT_CARRY: ${{ steps.range.outputs.carry }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const helper = path.join(
              process.env.GITHUB_WORKSPACE,
              '.ocr-action',
              'scripts',
              'github-actions',
              'post-review-comments.js',
            );
            const { runPostReviewComments } = require(helper);
            await runPostReviewComments({
              github,
              context,
              core,
              fs,
              prNumber: Number(process.env.PR_NUMBER),
              resultPath: process.env.RESULT_PATH,
              stderrPath: process.env.STDERR_PATH,
              stickySummary: process.env.OCR_STICKY_SUMMARY === 'true',
              incremental: process.env.OCR_INCREMENTAL === 'true',
              // No routing option: the helper routes nothing without a
              // threshold, so no finding moves to the summary.
              checkpointEnabled: process.env.OCR_CHECKPOINT_RANGE === 'true',
              checkpointCarry: process.env.CHECKPOINT_CARRY || '',
              checkpointBaseRef: process.env.BASE_REF || '',
              checkpointMergeBase: process.env.MERGE_BASE || '',
              checkpointFingerprint: process.env.CHECKPOINT_FINGERPRINT || '',
              checkpointNoop: false,
              // The range note names the scope, which the coverage section
              // reports, so the helper renders no range line of its own.
              rangeMode: '',
              rangeFrom: '',
              rangeTo: '',
              resolveOutdated: process.env.RESOLVE_OUTDATED,
              appSlug: process.env.OCR_APP_SLUG,
            });

      - name: Post the resumed review
        id: resume-post
        if: steps.outcome.outputs.post_resumed == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RESULT_PATH: /tmp/ocr-resume.json
          STDERR_PATH: /tmp/ocr-resume.err
          CHECKPOINT_FINGERPRINT: ${{ steps.outcome.outputs.final == '0' && steps.range.outputs.fingerprint || '' }}
          CHECKPOINT_CARRY: ${{ steps.range.outputs.carry }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const helper = path.join(
              process.env.GITHUB_WORKSPACE,
              '.ocr-action',
              'scripts',
              'github-actions',
              'post-review-comments.js',
            );
            const { runPostReviewComments } = require(helper);
            await runPostReviewComments({
              github,
              context,
              core,
              fs,
              prNumber: Number(process.env.PR_NUMBER),
              resultPath: process.env.RESULT_PATH,
              stderrPath: process.env.STDERR_PATH,
              stickySummary: process.env.OCR_STICKY_SUMMARY === 'true',
              incremental: process.env.OCR_INCREMENTAL === 'true',
              // No routing option: the helper routes nothing without a
              // threshold, so no finding moves to the summary.
              checkpointEnabled: process.env.OCR_CHECKPOINT_RANGE === 'true',
              checkpointCarry: process.env.CHECKPOINT_CARRY || '',
              checkpointBaseRef: process.env.BASE_REF || '',
              checkpointMergeBase: process.env.MERGE_BASE || '',
              checkpointFingerprint: process.env.CHECKPOINT_FINGERPRINT || '',
              checkpointNoop: false,
              // The range note names the scope, which the coverage section
              // reports, so the helper renders no range line of its own.
              rangeMode: '',
              rangeFrom: '',
              rangeTo: '',
              resolveOutdated: process.env.RESOLVE_OUTDATED,
              appSlug: process.env.OCR_APP_SLUG,
            });

      - name: Add the coverage section
        if: always() && steps.range.outputs.mode != 'noop'
        env:
          FIRST_COMMENT_URL: ${{ steps.post.outputs.summary_comment_url }}
          RESUMED_COMMENT_URL: ${{ steps.resume-post.outputs.summary_comment_url }}
          COVERAGE_SOURCE: ${{ steps.outcome.outputs.coverage_source }}
          COVERAGE_VERDICT: ${{ steps.outcome.outputs.coverage_verdict }}
          SCOPE_NOTE: ${{ steps.scope.outputs.note }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const path = require('path');
            const fs = require('fs');
            const coveragePath = '/tmp/ocr-coverage.md';
            if (!fs.existsSync(coveragePath)) {
              core.info('No coverage file; leaving the summary comment alone.');
              return;
            }
            const coverage = fs.readFileSync(coveragePath, 'utf8').trim();
            if (coverage === '') {
              core.info('The coverage file is empty; leaving the summary comment alone.');
              return;
            }
            // The scope note names the files and lines this run reviewed, which
            // the helper's own range line cannot: the reviewed base is a
            // synthetic commit of this clone, not a commit of the pull request.
            const note = (process.env.SCOPE_NOTE || '').trim();
            const section = note ? `### Review scope\n\n${note}\n\n${coverage}` : coverage;
            const fromResume = process.env.COVERAGE_SOURCE === 'resumed';
            const commentUrl = fromResume
              ? process.env.RESUMED_COMMENT_URL || ''
              : process.env.FIRST_COMMENT_URL || '';
            const urlMatch = /#issuecomment-(\d+)$/.exec(commentUrl);
            const head = process.env.HEAD_SHA || '';
            if (urlMatch && !/^[0-9a-f]{40}$/.test(head)) {
              throw new Error(`HEAD_SHA is not a full commit SHA: "${head}"`);
            }
            await core.summary.addRaw(section).write();
            if (!urlMatch) {
              core.info('This run posted no summary comment; the coverage section is only in the job summary.');
              return;
            }
            const commentId = Number(urlMatch[1]);
            const helperPath = path.join(
              process.env.GITHUB_WORKSPACE,
              '.ocr-action',
              'scripts',
              'github-actions',
              'post-review-comments.js',
            );
            const helper = require(helperPath);
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data: comment } = await github.rest.issues.getComment({
              owner,
              repo,
              comment_id: commentId,
            });
            // The coverage block goes after the summary marker and its run tag,
            // before the rest of the summary, so the comment stays findable and
            // keeps its single checkpoint marker.
            const start = '<!-- ocr-coverage:start -->';
            const end = '<!-- ocr-coverage:end -->';
            // A marker only counts on a line of its own, ignoring trailing
            // whitespace and a CRLF ending. A path or reason that the coverage
            // section renders can quote the marker, and it never sits alone on
            // a line.
            const markerLineAt = (text, marker, from) => {
              let at = text.indexOf(marker, from);
              while (at !== -1) {
                const lineStart = at === 0 || text[at - 1] === '\n';
                const rest = text.slice(at + marker.length);
                const lineEnd = /^[ \t]*(\r?\n|$)/.test(rest);
                if (lineStart && lineEnd) {
                  return at;
                }
                at = text.indexOf(marker, at + 1);
              }
              return -1;
            };
            // The hidden verdict line names the classification and the head the
            // section covers, so a same-head run reads this section as evidence
            // for its own head instead of trusting whichever section is newest.
            const verdict = process.env.COVERAGE_VERDICT || 'failed';
            const block = `${start}\n<!-- stomme-ocr-coverage-verdict: ${verdict} head=${head} -->\n${section}\n${end}`;
            let body = comment.body || '';
            const startAt = markerLineAt(body, start, 0);
            const endAt = startAt === -1 ? -1 : markerLineAt(body, end, startAt + start.length);
            if (startAt !== -1 && endAt !== -1) {
              body = body.slice(0, startAt) + block + body.slice(endAt + end.length);
            } else {
              const lines = body.split('\n');
              const markerAt = lines.findIndex((line) => line.includes(helper.SUMMARY_MARKER));
              if (markerAt === -1) {
                core.warning('The summary comment has no marker; not inserting the coverage section.');
                return;
              }
              let insertAt = markerAt + 1;
              if (lines[insertAt] && lines[insertAt].includes('<!-- ocr-summary-run:')) {
                insertAt += 1;
              }
              lines.splice(insertAt, 0, ...block.split('\n'));
              body = lines.join('\n');
            }
            await github.rest.issues.updateComment({
              owner,
              repo,
              comment_id: commentId,
              body,
            });
            core.info(`Inserted the coverage section into ${commentUrl}.`);

      - name: Read the checkpointed coverage
        id: checkpoint-coverage
        if: always() && steps.range.outputs.mode == 'noop'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const path = require('path');
            const helper = require(path.join(
              process.env.GITHUB_WORKSPACE,
              '.ocr-action',
              'scripts',
              'github-actions',
              'post-review-comments.js',
            ));
            // The summary comment of the run that checkpointed this head holds
            // the coverage section of the files it reviewed.
            const comment = await helper.findSummaryIssueComment({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              prNumber: Number(process.env.PR_NUMBER),
              sticky: process.env.OCR_STICKY_SUMMARY === 'true',
              appSlug: process.env.OCR_APP_SLUG,
              log: (line) => core.info(line),
            });
            const start = '<!-- ocr-coverage:start -->';
            const end = '<!-- ocr-coverage:end -->';
            // A marker only counts on a line of its own, ignoring trailing
            // whitespace and a CRLF ending. A path or reason that the coverage
            // section renders can quote the marker, and it never sits alone on
            // a line.
            const markerLineAt = (text, marker, from) => {
              let at = text.indexOf(marker, from);
              while (at !== -1) {
                const lineStart = at === 0 || text[at - 1] === '\n';
                const rest = text.slice(at + marker.length);
                const lineEnd = /^[ \t]*(\r?\n|$)/.test(rest);
                if (lineStart && lineEnd) {
                  return at;
                }
                at = text.indexOf(marker, at + 1);
              }
              return -1;
            };
            const body = (comment && comment.body) || '';
            const startAt = markerLineAt(body, start, 0);
            const endAt = startAt === -1 ? -1 : markerLineAt(body, end, startAt + start.length);
            if (startAt === -1 || endAt === -1) {
              core.warning('The summary comment of the checkpointed head has no coverage section.');
              core.setOutput('verdict', 'missing');
              return;
            }
            const section = body.slice(startAt + start.length, endAt).trim();
            const verdict = /<!-- stomme-ocr-coverage-verdict: (complete|partial|failed) head=([0-9a-f]{40}) -->/.exec(section);
            if (!verdict) {
              core.warning('The coverage section of the checkpointed head names no verdict.');
              core.setOutput('verdict', 'no-verdict');
              return;
            }
            if (verdict[2] !== process.env.HEAD_SHA) {
              core.warning(`The newest coverage section covers ${verdict[2]}, not the checkpointed head.`);
              core.setOutput('verdict', 'other-head');
              return;
            }
            await core.summary.addRaw(section).write();
            core.setOutput('verdict', verdict[1]);

      - name: Report the OCR result
        if: always()
        env:
          RANGE_MODE: ${{ steps.range.outputs.mode }}
          SCOPE_MODE: ${{ steps.scope.outputs.mode }}
          FINAL: ${{ steps.outcome.outputs.final }}
          REASON: ${{ steps.outcome.outputs.reason }}
          CHECKPOINT_VERDICT: ${{ steps.checkpoint-coverage.outputs.verdict }}
        run: |
          if [ "$RANGE_MODE" = "noop" ]; then
            if [ "$CHECKPOINT_VERDICT" = "complete" ]; then
              echo "The checkpoint already covers the head, and its coverage section reports every selected file as reviewed."
              exit 0
            fi
            case "$CHECKPOINT_VERDICT" in
              partial) detail="its coverage section reports unreviewed files" ;;
              failed) detail="its coverage section reports a failed run" ;;
              no-verdict) detail="its coverage section names no verdict" ;;
              other-head) detail="its coverage section covers another head" ;;
              *) detail="this head has no coverage section" ;;
            esac
            echo "::error::the OCR review cannot review the same head again, because $detail. Push a new commit to review this change."
            exit 1
          fi
          if [ "$SCOPE_MODE" = "empty" ]; then
            echo "The scope since the last complete review holds no new lines, so this run reviewed nothing."
            exit 0
          fi
          if [ "$FINAL" != "0" ] && [ -f /tmp/ocr-coverage.err ]; then
            while IFS= read -r line; do
              case "$line" in
                *": not reviewed ("*)
                  message="${line#stomme: }"
                  echo "::error::${message//%/%25}"
                  ;;
              esac
            done < /tmp/ocr-coverage.err
          fi
          if [ "$FINAL" = "0" ]; then
            echo "The OCR review covered every selected file."
            exit 0
          fi
          if [ "$FINAL" = "2" ]; then
            echo "::error::the OCR review left selected files unreviewed"
          elif [ -n "$REASON" ]; then
            reason="${REASON//%/%25}"
            reason="${reason//$'\r'/%0D}"
            reason="${reason//$'\n'/%0A}"
            echo "::error::the OCR review failed: $reason"
          else
            echo "::error::the OCR review failed"
          fi
          exit 1
