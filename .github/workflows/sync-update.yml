name: Sync stomme update

on:
  workflow_call:
    inputs:
      guides-directory:
        required: false
        type: string
    secrets:
      app-id:
        required: true
      app-private-key:
        required: true

permissions:
  contents: read

jobs:
  sync:
    name: Sync
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      commit: ${{ steps.commit.outputs.commit }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
    permissions:
      contents: read
    steps:
      - name: Check the trigger
        id: guard
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          if [ "$EVENT_NAME" != "push" ]; then
            echo "::notice::Not a push; nothing to sync."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$REF" != "refs/heads/renovate/stomme" ]; then
            echo "::notice::Not the renovate/stomme branch; nothing to sync."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$ACTOR_ID" != "29139614" ]; then
            echo "::notice::Not pushed by Renovate; nothing to sync."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.guard.outputs.run == 'true'
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check the update commit
        id: check
        if: steps.guard.outputs.run == 'true'
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          tip=$(git rev-parse HEAD)
          if [ "$tip" != "$EXPECTED_SHA" ]; then
            echo "::notice::The branch moved past the triggering commit; nothing to sync."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          author=$(git log -1 --format=%ae)
          if [ "$author" != "29139614+renovate[bot]@users.noreply.github.com" ]; then
            echo "::notice::The tip was not authored by Renovate; nothing to sync."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        if: steps.guard.outputs.run == 'true' && steps.check.outputs.run == 'true'
      - name: Sync stomme files
        if: steps.guard.outputs.run == 'true' && steps.check.outputs.run == 'true'
        run: stomme sync
      - name: Check the guides directory
        if: steps.guard.outputs.run == 'true' && steps.check.outputs.run == 'true' && inputs['guides-directory'] != ''
        env:
          GUIDES_DIRECTORY: ${{ inputs['guides-directory'] }}
        run: |
          root=$(realpath -m -- "$PWD")
          destination=$(realpath -m -- "$GUIDES_DIRECTORY")

          case "$destination" in
            "$root"/*) ;;
            *)
              echo "::error::The guides directory must be a folder inside the repository: $destination"
              exit 1
              ;;
          esac

          case "$destination" in
            "$root/.git" | "$root/.git"/*)
              echo "::error::The guides directory must not be inside the Git folder: $destination"
              exit 1
              ;;
          esac

          case "$destination" in
            "$root/docs/stomme" | "$root/docs/stomme"/*)
              echo "::error::The guides directory must not be the project's synced guides folder or a folder inside it: $destination"
              exit 1
              ;;
          esac

          probe=$destination
          while [ "$probe" != "$root" ]; do
            if [ -e "$probe/.git" ] || git ls-files --stage -- "$probe" | grep -q '^160000'; then
              echo "::error::The guides directory must not be inside another Git repository: $destination"
              exit 1
            fi
            probe=$(dirname "$probe")
          done

          status=0
          git check-ignore -q -- "$destination" || status=$?

          if [ "$status" -eq 1 ]; then
            status=0
            git check-ignore -q -- "$destination/" || status=$?
          fi

          if [ "$status" -eq 0 ]; then
            echo "::error::Git ignores the guides directory, so the sync cannot commit the guides: $destination"
            exit 1
          fi

          if [ "$status" -ne 1 ]; then
            echo "::error::Git could not check the guides directory: $destination"
            exit 1
          fi
      - name: Write the guides
        if: steps.guard.outputs.run == 'true' && steps.check.outputs.run == 'true' && inputs['guides-directory'] != ''
        env:
          GUIDES_DIRECTORY: ${{ inputs['guides-directory'] }}
        run: stomme guides "$GUIDES_DIRECTORY"
      - name: Check the written guides
        if: steps.guard.outputs.run == 'true' && steps.check.outputs.run == 'true' && inputs['guides-directory'] != ''
        env:
          GUIDES_DIRECTORY: ${{ inputs['guides-directory'] }}
        run: |
          if ! ignored=$(git ls-files --others --ignored --exclude-standard -- "$GUIDES_DIRECTORY"); then
            echo "::error::Git could not list the guides directory: $GUIDES_DIRECTORY"
            exit 1
          fi

          if [ -z "$ignored" ]; then
            exit 0
          fi

          printf '%s\n' "$ignored"
          echo "::error::Git ignores files inside the guides directory, so the sync cannot commit the guides: $GUIDES_DIRECTORY"
          exit 1
      - name: Detect the lockfile
        id: lockfile
        if: steps.guard.outputs.run == 'true' && steps.check.outputs.run == 'true'
        run: |
          if git diff --quiet -- package.json; then
            echo "kind=none" >> "$GITHUB_OUTPUT"
          elif [ -f pnpm-lock.yaml ] && [ -f bun.lock ]; then
            echo "found both pnpm-lock.yaml and bun.lock; keep one" >&2
            exit 1
          elif [ -f pnpm-lock.yaml ]; then
            echo "kind=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f bun.lock ]; then
            echo "kind=bun" >> "$GITHUB_OUTPUT"
          else
            echo "kind=none" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.guard.outputs.run == 'true' && steps.check.outputs.run == 'true' && steps.lockfile.outputs.kind == 'pnpm'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.guard.outputs.run == 'true' && steps.check.outputs.run == 'true' && steps.lockfile.outputs.kind == 'pnpm'
        with:
          node-version: 24
      - name: Refresh the pnpm lockfile
        if: steps.guard.outputs.run == 'true' && steps.check.outputs.run == 'true' && steps.lockfile.outputs.kind == 'pnpm'
        run: pnpm install --lockfile-only
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.guard.outputs.run == 'true' && steps.check.outputs.run == 'true' && steps.lockfile.outputs.kind == 'bun'
        with:
          bun-version: 1.4.2
      - name: Refresh the Bun lockfile
        if: steps.guard.outputs.run == 'true' && steps.check.outputs.run == 'true' && steps.lockfile.outputs.kind == 'bun'
        run: bun install --lockfile-only
      - name: Commit the sync
        id: commit
        if: steps.guard.outputs.run == 'true' && steps.check.outputs.run == 'true'
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add --all
          git -c core.hooksPath=/dev/null -c user.name=stomme -c user.email=stomme@localhost commit -m "chore: sync stomme files"
          commit=$(git rev-parse HEAD)
          git bundle create sync.bundle "$EXPECTED_SHA..HEAD"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        if: steps.guard.outputs.run == 'true' && steps.check.outputs.run == 'true' && steps.commit.outputs.changed == 'true'
        with:
          name: sync-bundle
          path: sync.bundle
          if-no-files-found: error
          retention-days: 1

  push:
    name: Push
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Fetch the sync artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ARTIFACT_ID: ${{ needs.sync.outputs.artifact }}
        run: |
          if [ -z "$ARTIFACT_ID" ]; then
            echo "::error::The sync job reported no artifact."
            exit 1
          fi
          directory=$(mktemp -d "$RUNNER_TEMP/sync.XXXXXX")
          gh api "/repos/${REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > "$directory/sync-artifact.zip"
          echo "directory=$directory" >> "$GITHUB_OUTPUT"
      - name: Check the sync bundle
        id: bundle
        env:
          WORK: ${{ steps.artifact.outputs.directory }}
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_COMMIT: ${{ needs.sync.outputs.commit }}
        run: |
          cd "$WORK"
          archive="$WORK/sync-artifact.zip"
          if [ ! -f "$archive" ]; then
            echo "::error::The sync artifact archive is missing."
            exit 1
          fi
          if ! unzip -p "$archive" sync.bundle > "$WORK/sync.bundle"; then
            echo "::error::The sync artifact has no readable sync.bundle entry."
            exit 1
          fi
          if [ ! -f sync.bundle ] || [ ! -s sync.bundle ]; then
            echo "::error::The sync artifact has no regular sync.bundle entry."
            exit 1
          fi
          git init --quiet .
          base_url="https://github.com/${REPOSITORY}.git"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          if ! git -c "http.https://github.com/.extraheader=$auth" fetch --no-tags "$base_url" "$EXPECTED_SHA"; then
            echo "::error::Could not fetch the expected commit."
            exit 1
          fi
          if ! git bundle verify sync.bundle; then
            echo "::error::The sync bundle is not valid."
            exit 1
          fi
          heads=$(git bundle list-heads sync.bundle)
          if [ "$(printf '%s\n' "$heads" | grep -c .)" -ne 1 ]; then
            echo "::error::The sync bundle must hold exactly one head."
            exit 1
          fi
          head=$(printf '%s\n' "$heads" | cut -d' ' -f1)
          ref=$(printf '%s\n' "$heads" | cut -d' ' -f2-)
          if ! git fetch --no-tags "$PWD/sync.bundle" "${ref}:refs/bundle/tip"; then
            echo "::error::Could not read the sync bundle."
            exit 1
          fi
          tip=$(git rev-parse refs/bundle/tip)
          if [ "$tip" != "$EXPECTED_COMMIT" ]; then
            echo "::error::The sync bundle tip is not the commit the sync job reported."
            exit 1
          fi
          if [ "$head" != "$tip" ]; then
            echo "::error::The sync bundle heads disagree."
            exit 1
          fi
          if [ "$(git rev-list --count "$EXPECTED_SHA..$tip")" -ne 1 ]; then
            echo "::error::The sync bundle must hold exactly one commit above the expected commit."
            exit 1
          fi
          if [ "$(git rev-list --parents -n 1 "$tip")" != "$tip $EXPECTED_SHA" ]; then
            echo "::error::The sync bundle commit must have the expected commit as its only parent."
            exit 1
          fi
          echo "tip=$tip" >> "$GITHUB_OUTPUT"
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: token
        with:
          app-id: ${{ secrets['app-id'] }}
          private-key: ${{ secrets['app-private-key'] }}
      - name: Push the sync
        env:
          WORK: ${{ steps.artifact.outputs.directory }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.sha }}
          TIP: ${{ steps.bundle.outputs.tip }}
        run: |
          cd "$WORK"
          user_id=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
          name="${APP_SLUG}[bot]"
          email="${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          message=$(git log -1 --format=%B "$TIP")
          commit=$(GIT_AUTHOR_NAME="$name" GIT_AUTHOR_EMAIL="$email" GIT_COMMITTER_NAME="$name" GIT_COMMITTER_EMAIL="$email" git commit-tree "$TIP^{tree}" -p "$EXPECTED_SHA" -m "$message")
          push_url="https://github.com/${REPOSITORY}.git"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          if output=$(git -c core.hooksPath=/dev/null -c "http.https://github.com/.extraheader=$auth" push --force-with-lease="refs/heads/renovate/stomme:${EXPECTED_SHA}" "$push_url" "${commit}:refs/heads/renovate/stomme" 2>&1); then
            exit 0
          fi
          if printf '%s' "$output" | grep -qE 'non-fast-forward|fetch first|stale info'; then
            echo "push conflict on renovate/stomme; the branch moved, so nothing was pushed" >&2
          else
            printf '%s\n' "$output" >&2
          fi
          exit 1
