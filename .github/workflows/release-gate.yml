name: Release gate

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  project:
    name: Gate ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [tau, koja, plugga, tikk, greppa, ruta, mutation]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: stomme
          persist-credentials: false
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: token
        with:
          app-id: ${{ secrets.STOMME_APP_ID }}
          private-key: ${{ secrets.STOMME_APP_PRIVATE_KEY }}
          owner: sQVe
          repositories: ${{ matrix.project }}
          permission-contents: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sQVe/${{ matrix.project }}
          ref: main
          path: project
          token: ${{ steps.token.outputs.token }}
          persist-credentials: false
      - name: Download the candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifacts-build-local-x86_64-unknown-linux-gnu
          path: ${{ runner.temp }}/dist
      - name: Extract the candidate
        run: |
          tar -xJf "$RUNNER_TEMP/dist/stomme-x86_64-unknown-linux-gnu.tar.xz" -C "$RUNNER_TEMP/dist"
          echo "VERSION=${{ fromJson(inputs.plan).releases[0].app_version }}" >> "$GITHUB_ENV"
      - name: Run the gate
        working-directory: stomme
        run: |
          cargo xtask release-gate \
            --stomme "$RUNNER_TEMP/dist/stomme-x86_64-unknown-linux-gnu/stomme" \
            --version "$VERSION" \
            "$GITHUB_WORKSPACE/project" >> "$GITHUB_STEP_SUMMARY"

  consumer:
    name: Gate consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: stomme
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.3.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Download the candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifacts-build-local-x86_64-unknown-linux-gnu
          path: ${{ runner.temp }}/dist
      - name: Extract the candidate
        run: |
          tar -xJf "$RUNNER_TEMP/dist/stomme-x86_64-unknown-linux-gnu.tar.xz" -C "$RUNNER_TEMP/dist"
          echo "VERSION=${{ fromJson(inputs.plan).releases[0].app_version }}" >> "$GITHUB_ENV"
      - name: Check the init pin
        working-directory: stomme
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          mkdir "$RUNNER_TEMP/init-pin"
          cargo xtask release-pin \
            --stomme "$RUNNER_TEMP/dist/stomme-x86_64-unknown-linux-gnu/stomme" \
            --version "$VERSION" \
            --commit "$RELEASE_COMMIT" \
            "$RUNNER_TEMP/init-pin"
      - name: Prepare the consumer
        run: |
          mkdir -p "$RUNNER_TEMP/consumer"
          cp -R stomme/release/consumer/. "$RUNNER_TEMP/consumer"
          git init --quiet "$RUNNER_TEMP/consumer"
          git -C "$RUNNER_TEMP/consumer" add --all
          git -C "$RUNNER_TEMP/consumer" \
            -c user.name="Stomme Release" \
            -c user.email="stomme@example.com" \
            commit --quiet --message "Prepare the consumer"
      - name: Run the gate
        working-directory: stomme
        run: |
          cargo xtask release-gate \
            --stomme "$RUNNER_TEMP/dist/stomme-x86_64-unknown-linux-gnu/stomme" \
            --version "$VERSION" \
            "$RUNNER_TEMP/consumer" >> "$GITHUB_STEP_SUMMARY"
      - name: Install the recorded packages
        working-directory: ${{ runner.temp }}/consumer
        run: pnpm install
