name: CI

on:
  push:
    branches: [main]
  # Every base branch, so pull requests stacked on another pull request run CI too.
  pull_request:
  schedule:
    # Weekly, so new security advisories fail cargo-deny without a code change.
    - cron: "0 5 * * 1"
  workflow_dispatch:

concurrency:
  # The event is part of the group, so a push to main does not cancel the scheduled audit.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-deny,cargo-shear,typos,taplo
      - run: cargo xtask check tidy

  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-nextest
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install: false
      - name: Install herdr-app
        working-directory: foundation/layers/herdr/skeleton/merge
        run: |
          mise trust
          mise install http:herdr-app
          herdr=$(mise where http:herdr-app)
          echo "$herdr/herdr-app" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: cargo xtask check build

  mutation-shard:
    name: Mutation (changed) shard ${{ matrix.shard }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # One runner cannot finish a large diff before the timeout, so the mutants are split across
    # four runners and one job merges their reports.
    timeout-minutes: 180
    strategy:
      # A failed shard must not cancel the others, so every report still reaches the aggregate.
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install: false
      - name: Install herdr-app
        working-directory: foundation/layers/herdr/skeleton/merge
        run: |
          mise trust
          mise install http:herdr-app
          herdr=$(mise where http:herdr-app)
          echo "$herdr/herdr-app" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - name: Mutate the pull request's diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SHARD: ${{ matrix.shard }}
        run: |
          free -m
          df -h
          status=0
          cargo xtask mutation changed "$BASE_SHA" --shard "$SHARD/4" > mutation-report.json || status=$?
          free -m
          df -h
          cat mutation-report.json
          if [ -s mutation-report.json ]; then
            {
              echo "### Mutation testing (shard $SHARD)"
              echo
              jq -r '"Status: \(.status), \(.survivors | length) survivors"' mutation-report.json
              jq -r '.survivors[] | "- `\(.file):\(.line)`: \(.original) -> \(.replacement)"' mutation-report.json
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            exit "$status"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-shard-${{ matrix.shard }}
          path: |
            mutation-report.json
            target/mutants/mutants.out/debug.log
          if-no-files-found: warn

  mutation:
    name: Mutation (changed)
    if: always() && github.event_name == 'pull_request'
    needs: [mutation-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutation-shard-*
          path: shards
      - name: Merge the shard reports
        run: |
          shopt -s nullglob
          reports=(shards/mutation-shard-*/mutation-report.json)
          if [ "${#reports[@]}" -eq 0 ]; then
            echo "No shard wrote a report." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          jq -s '
            def overall:
              if any(.[]; .status == "error") then "error"
              elif any(.[]; (.survivors | length) > 0) then "survivors"
              elif all(.[]; .status == "nothing") then "nothing"
              else "pass" end;
            . as $reports
            | {
                status: ($reports | overall),
                survivors: ($reports | map(.survivors) | add),
                unmutated: ($reports | map(.unmutated) | add | unique),
              }
          ' "${reports[@]}" > mutation-report.json
          {
            echo "### Mutation testing"
            echo
            jq -r '"Status: \(.status), \(.survivors | length) survivors"' mutation-report.json
            jq -r '.survivors[] | "- `\(.file):\(.line)`: \(.original) -> \(.replacement)"' mutation-report.json
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail when a shard failed
        if: needs.mutation-shard.result != 'success'
        env:
          SHARD_RESULT: ${{ needs.mutation-shard.result }}
        run: |
          echo "::error::The mutation shards finished as $SHARD_RESULT."
          exit 1

  mutation-audit:
    name: Mutation audit
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install: false
      - name: Install herdr-app
        working-directory: foundation/layers/herdr/skeleton/merge
        run: |
          mise trust
          mise install http:herdr-app
          herdr=$(mise where http:herdr-app)
          echo "$herdr/herdr-app" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - name: Mutate the whole workspace
        run: |
          status=0
          cargo mutants --workspace --test-tool nextest || status=$?
          echo "cargo-mutants exited with $status"
          case "$status" in
            0 | 2 | 3) ;;
            *) exit "$status" ;;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants.out
          path: mutants.out
          if-no-files-found: warn
