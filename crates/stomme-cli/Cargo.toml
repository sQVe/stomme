[package]
name = "stomme"
version = "0.2.3"
description = "A shared foundation for project structure, coding rules, and documentation."
repository = "https://github.com/sQVe/stomme"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
pulldown-cmark.workspace = true
ra-ap-rustc_lexer.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true
unicode-properties.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

[package.metadata.dist]
dist = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/stomme-{ target }.tar.xz"
pkg-fmt = "txz"
bin-dir = "stomme-{ target }/{ bin }{ binary-ext }"

[package.metadata.cargo-shear]
ignored-paths = ["tests/fixtures/rules/**/*.rs", "tests/fixtures/adoption/**/*.rs"]
